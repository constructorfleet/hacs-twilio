# Services provided by the Twilio integration
# These are available through the notify platform

# SMS/MMS Service (via notify platform)
# Service: notify.twilio_sms
# Description: Send SMS or MMS messages via Twilio
# Fields:
#   message: Text message to send
#   target: List of phone numbers (with country code, e.g., +1234567890)
#   data:
#     media_url: (Optional) URL(s) of media to send (for MMS)
#     camera_entity: (Optional) Camera entity ID to attach (requires Home Assistant external_url)
#     image_entity: (Optional) Image entity ID to attach (requires Home Assistant external_url)
#     image_path: (Optional) Local image file path under <config>/www (requires Home Assistant external_url, max 5MB)
#     status_callback: (Optional) Enable status callbacks (true/false)
#     status_callback_method: (Optional) HTTP method for status callbacks (POST/GET/PUT, default: POST)

# Voice Call Service (via notify platform)  
# Service: notify.twilio_call
# Description: Make automated voice calls via Twilio
# Fields:
#   message: Message to speak or TwiML URL
#   target: List of phone numbers (with country code, e.g., +1234567890)
#   data:
#     call_type: (Optional) Type of call - "simple", "twiml", or "interactive" (default: "simple")
#     twiml_url: (Optional) Custom TwiML URL for call_type "twiml"
#     gather_enabled: (Optional) Enable DTMF input collection (default: false)
#     record_enabled: (Optional) Enable call recording (default: false)
#     transcribe_enabled: (Optional) Enable transcription of recordings (default: false)
#     status_callback: (Optional) Enable status callbacks (true/false)
#     status_callback_method: (Optional) HTTP method for status callbacks (POST/GET/PUT, default: POST)
#     gather_config: (Optional) Configuration for gather
#       num_digits: Number of digits to collect (default: 1)
#       timeout: Timeout in seconds (default: 5)
#       finish_on_key: Key to finish input (default: "#")
#     transcribe: (Optional) Enhanced real-time streaming transcription configuration
#       language_code: Language code for transcription (default: "en-US")
#       profanity_filter: Filter profanity in transcription (true/false, default: false)
#       partial_results: Enable partial transcription results in real-time (true/false, default: false)
#       automatic_punctuation: Enable automatic punctuation (true/false, default: false)

# Make Call Service
make_call:
  name: Make Call
  description: Make a voice call and return call information (call_sid, entity_id)
  fields:
    to:
      name: To
      description: Phone number to call (with country code, e.g., +1234567890)
      required: true
      example: "+1234567890"
      selector:
        text:
    from_number:
      name: From Number
      description: Your Twilio phone number (with country code, e.g., +1234567890)
      required: true
      example: "+1234567890"
      selector:
        text:
    message:
      name: Message
      description: Message to speak or TwiML URL
      required: false
      default: ""
      example: "Hello from Home Assistant"
      selector:
        text:
    transcription:
      name: Enable Transcription
      description: Enable real-time call transcription via Twilio Start/Transcription
      required: false
      default: false
      selector:
        boolean:
    language_code:
      name: Transcription Language
      description: BCP-47 language code for transcription
      required: false
      default: "en-US"
      example: "en-US"
      selector:
        text:
    profanity_filter:
      name: Profanity Filter
      description: Filter profanity in transcription results
      required: false
      default: false
      selector:
        boolean:
    automatic_punctuation:
      name: Automatic Punctuation
      description: Enable automatic punctuation in transcription results
      required: false
      default: false
      selector:
        boolean:
    transcription_pause:
      name: Transcription Pause
      description: Duration in seconds to keep the call active for transcription
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: "seconds"
    webhook_method:
      name: Webhook Method
      description: HTTP method for transcription status callback (POST/GET/PUT)
      required: false
      default: "POST"
      example: "POST"
      selector:
        text:

# Send DTMF Service
send_dtmf:
  name: Send DTMF Digits
  description: Send DTMF digits (key presses) to an active voice call
  fields:
    call_sid:
      name: Call SID
      description: The unique identifier of the active call (from sensor or event)
      required: true
      example: "CA1234567890abcdef1234567890abcdef"
      selector:
        text:
    digits:
      name: Digits
      description: DTMF digits to send (0-9, *, #, w for 0.5s pause)
      required: true
      example: "1234#"
      selector:
        text:

# Start Recording Service
start_recording:
  name: Start Call Recording
  description: Start recording an active voice call on demand using TwiML
  fields:
    call_sid:
      name: Call SID
      description: The unique identifier of the active call (from sensor or event)
      required: true
      example: "CA1234567890abcdef1234567890abcdef"
      selector:
        text:
    max_length:
      name: Max Length
      description: Maximum recording length in seconds (1-14400, default 3600)
      required: false
      default: 3600
      selector:
        number:
          min: 1
          max: 14400
          unit_of_measurement: "seconds"
    recording_status_callback:
      name: Status Callback
      description: Enable recording status callbacks to the configured webhook
      required: false
      default: false
      selector:
        boolean:
    transcribe:
      name: Transcribe
      description: Enable transcription of the recording
      required: false
      default: false
      selector:
        boolean:
    transcribe_callback:
      name: Transcribe Callback
      description: Enable transcription callbacks to the configured webhook
      required: false
      default: false
      selector:
        boolean:

# Pause Service
pause:
  name: Pause Call
  description: Pause an active call for a specified duration using TwiML
  fields:
    call_sid:
      name: Call SID
      description: The unique identifier of the active call (from sensor or event)
      required: true
      example: "CA1234567890abcdef1234567890abcdef"
      selector:
        text:
    length:
      name: Length
      description: Length of pause in seconds (1-3600, default 1)
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: "seconds"
